name: Production CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install --requirement requirements.txt
      - run: npm test
      - run: npm run verify:migrations
      - run: npm run verify:production
      - run: npm run build
      - run: python -m compileall -q backend
      - run: python -c "import api.index"
      - run: python -m unittest discover -s backend -p "test_*.py"
      - run: npm run audit:production
      - uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist
          if-no-files-found: error

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Validate Vercel deploy secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "$name is missing in the production environment"
              missing=1
            else
              echo "$name is present (length=${#value})"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if [[ "$VERCEL_ORG_ID" != team_* ]]; then
            echo "VERCEL_ORG_ID must start with team_"
            exit 1
          fi
          if [[ "$VERCEL_PROJECT_ID" != prj_* ]]; then
            echo "VERCEL_PROJECT_ID must start with prj_"
            exit 1
          fi
      - name: Vercel authentication check
        run: npx vercel whoami
      - name: Deploy to Vercel production
        run: npx vercel deploy --prod --yes
